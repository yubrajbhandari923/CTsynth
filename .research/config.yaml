# Research project configuration (human-editable).
# Only settings that differ from the inherited defaults are listed here.
#   research config show --effective    every value actually in force
#   research config show --sources      where each value comes from
#   research config check               validate this file
# Comments and ordering are preserved: Research OS rewrites only the keys it is asked to change.

project:
  name: CTsynth
  description: ''
  goal: Build the minimum reliable foundation for a long-term research platform that creates editable,
    physics-grounded virtual CT patient populations.
  created_at: '2026-10-11T19:14:28-04:00'
  git_repo: null
hpc:
  bundle:
    # Replaces the default list (which ignores .gitignore): keep data, outputs, caches, checkpoints out of bundles.
    exclude: ['.git', '.github', '.research', '__pycache__', '*.pyc', '.venv*', 'venv', '.venv-*', 'node_modules',
      '.mypy_cache', '.pytest_cache', '.ruff_cache', '.DS_Store', '*.egg-info', '.ipynb_checkpoints',
      'outputs', 'runs_local', 'bundles', 'runs_imported', 'incoming', 'data/aapm', 'projects/*/results*',
      '*.npy.gz', '*.pt', '*.pth', '*.ckpt', '*.tar.gz', '*.zip', '.env*']
  clusters:
    duke:
      project:
        slug: CTsynth

