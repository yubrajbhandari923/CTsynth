<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
<text x="190" y="22" font-size="14" font-weight="bold">Volume-fraction RMSE on official benchmark images (3 cases)</text>
