<line x1="306.7" y1="270" x2="306.7" y2="275" stroke="#333"/><text x="306.7" y="290" text-anchor="middle">0.5</text>
<line x1="423.3" y1="270" x2="423.3" y2="275" stroke="#333"/><text x="423.3" y="290" text-anchor="middle">1.0</text>
<line x1="540.0" y1="270" x2="540.0" y2="275" stroke="#333"/><text x="540.0" y="290" text-anchor="middle">1.5</text>
<text x="415" y="322" text-anchor="middle">RMSE of estimated volume fraction (dimensionless; lower is better)</text></svg>
