experiment_id: EXP-004
name: aapm_b0_b4_ladder_synthetic
seed: 0
device: cpu
params:
  # synthetic AAPM-schema data, image domain only (no fan-beam projector exists)
  n_pix: 32
  n_views: 32
  n_det: 48
  n_cases: 60
  f_train: 0.7
  f_val: 0.2
  f_test: 0.1          # test split is generated by the split rule but NEVER loaded
  table_dir: data/aapm_kit_sample
  roi: 8               # reduced-size ROI for s2 (kit ROI 25 does not fit 32 px usefully)
  # matched budget for every learned rung (B2, B3, B4a-f)
  depth: 1
  width: 8
  epochs: 80
  lr: 0.003
  batch_size: 4
  n_seeds: 3
  air_cutoff: 0.1
  prior_weight: 1.0    # weight of the single added prior (consistency weight is fixed at 1.0)
  # classical rungs
  lam_tv: 0.0001       # inherited from projects/p02_aapm_benchmark/evaluate.py, NOT re-selected here
  tv_iters: 300
  # mixed-voxel definition: predicted max material fraction below this on TISSUE pixels
  mixed_thresh: 0.9
