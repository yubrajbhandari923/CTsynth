[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctsynth"
version = "0.0.1"
description = "Editable, physics-grounded virtual CT patient populations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
torch = ["torch>=2.1"]  # CPU-first; MPS/CUDA picked at runtime by ctsynth.device
physics = ["torch>=2.1"]  # ctsynth.physics is torch-based (autograd); only this subpackage needs it

[project.scripts]
ctsynth = "ctsynth.hpc.cli:main"

[dependency-groups]
dev = ["torch>=2.1", "pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# frozen as run on the cluster (RUN-0012/0013): editing would change the recorded script hash
extend-exclude = ["scripts/hpc_smoke.py", "scripts/hpc_env_probe.py"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# long provenance strings are data, not code: rewrapping them would change the recorded text
"scripts/make_tables.py" = ["E501"]
# frozen as run on the cluster (RUN-0012/0013): editing would change the recorded script hash;
# stdlib/py3.8 style on purpose
"scripts/hpc_smoke.py" = ["E501", "UP"]
"scripts/hpc_env_probe.py" = ["E501", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
